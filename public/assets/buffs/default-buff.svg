<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="buffBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="buffBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="70%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>
    <filter id="buffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="url(#buffBg)" stroke="url(#buffBorder)" stroke-width="2.5"/>

  <!-- Inner Subtle Ring -->
  <rect x="5" y="5" width="54" height="54" rx="8" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Heraldic Shield / Upward Crest Glyph -->
  <g filter="url(#buffGlow)">
    <!-- Upward Chevrons (Positive Enhancement) -->
    <path d="M32 14 L46 26 L41 29 L32 20 L23 29 L18 26 Z" fill="#38bdf8" opacity="0.95"/>
    <path d="M32 24 L44 34 L40 37 L32 29 L24 37 L20 34 Z" fill="#60a5fa" opacity="0.85"/>
    <!-- Central Power Sparkle / Diamond -->
    <path d="M32 34 L36 41 L43 45 L36 49 L32 56 L28 49 L21 45 L28 41 Z" fill="#fbbf24"/>
    <circle cx="32" cy="45" r="2.5" fill="#ffffff"/>
  </g>
</svg>
